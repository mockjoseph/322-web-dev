<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Intro</title>
    <!-- External stylesheet -->
    <link rel="stylesheet" href="styles.css">
    <!-- Embedded stylesheet , overwrite external-->
    <style>
        h1, p, h2 {
            background-color: brown;
            font-size: 3rem;
            margin: 0px;
        }
        
        .header {
            font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif
        }
        #two {
            font-size: x-large;
        }
        p:hover {
            background-color: yellow;
            cursor: pointer;
        }

        div > p {
            color: blue;
        }
    </style>
</head>
<body>
    <header>
        <!-- Styling using class names -->
        <h1 class="header">h1</h1>
    </header>
    <main>
        <p>
            This is a paragraph
        </p>
        <ol>
            <!-- Inline styles , overwrite emvedded styles-->
            <li style="background-color: cadetblue;">One</li>
            <li id="two">Two</li>
            <!--Works for output, but ids should be unique-->
            <li id="two">Three</li>
        </ol>
        <h2 class="header">h2</h2>

        <div>
            <p>This is also a paragraph</p>
            <section>
                <p>This is a paragraph</p>
            </section>
        </div>
    </main>
    <footer>

    </footer>
</body>
</html>
